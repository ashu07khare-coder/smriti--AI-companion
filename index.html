    <script>
      (function() {
        // 1. Intercept and prevent uncaught errors for fetch getter assignment from bubbling
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(e) {
            if (e && e.message && typeof e.message === 'string' && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }, true);

          var prevOnError = window.onerror;
          window.onerror = function(msg) {
            if (typeof msg === 'string' && msg.indexOf('fetch') !== -1 && msg.indexOf('getter') !== -1) {
              return true;
            }
            if (typeof prevOnError === 'function') {
              return prevOnError.apply(this, arguments);
            }
          };
        }

        // 2. Ensure every level of the window prototype chain has a valid fetch setter and getter
        try {
          var realFetch = window.fetch;
          var activeFetch = typeof realFetch === 'function' ? realFetch.bind(window) : realFetch;

          var descriptor = {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          };

          var curr = window;
          while (curr) {
            try {
              var d = Object.getOwnPropertyDescriptor(curr, 'fetch');
              if (d) {
                if (d.configurable) {
                  try {
                    delete curr.fetch;
                  } catch (_) {}
                }
                try {
                  Object.defineProperty(curr, 'fetch', descriptor);
                } catch (_) {}
              }
            } catch (_) {}
            try {
              curr = Object.getPrototypeOf(curr);
            } catch (_) {
              curr = null;
            }
          }

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (_) {}
          }

          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (_) {}
        } catch (_) {}
      })();
    </script>
